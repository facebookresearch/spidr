[project]
name = "spidr"
description = "Learning Fast and Stable Linguistic Units for Spoken Language Models Without Supervision"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-4.0"
authors = [{ name = "Fundamental AI Research (FAIR) at Meta" }]
keywords = ["machine learning", "speech"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26.4",
  "torch>=2.13.0",
]
dynamic = ["version"]

[project.urls]
github = "https://github.com/facebookresearch/spidr"

[project.optional-dependencies]
plot = [
  "fastabx>=0.8.0",
  "matplotlib>=3.10.3",
  "polars>=1.44.1",
  "scikit-learn>=1.7.0",
  "scipy>=1.16.0",
  "torchcodec>=0.16.0",
]
train = [
  "polars>=1.44.1",
  "submitit>=1.5.2",
  "torchcodec>=0.16.0",
  "tqdm>=4.67.1",
  "viztracer>=1.0.3",
  "wandb>=0.19.10",
]

[dependency-groups]
dev = [
  "prek>=0.5.2",
]
test = [
  "hypothesis>=6.167.1",
  "pytest>=9.1.1",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["src/spidr"]

[tool.hatch.version]
source = "vcs"

[tool.pytest]
filterwarnings = ["error"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
  "correctness",
  "suspicious",
  "complexity",
  "performance",
  "style",
  "missing-copyright-notice",
]
preview = true

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["F"]  # from torch.nn import functional as F

[tool.ruff.lint.flake8-self]
extend-ignore-names = ["_foreach_norm", "_appdirs", "_inductor", "_inner_ema"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.typos.default.extend-words]
interm = "interm"
IY = "IY"
arange = "arange"
