name: Release Workflow
permissions: {}

on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never interrupt an in-flight release.

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

      - name: pre-commit hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  test:
    name: Test source code (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: false
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg # Required by torchcodec
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install the project
        run: uv sync --locked --all-extras --group test

      - name: Run tests
        run: uv run pytest tests/

  test-lowest:
    name: Test with the lowest supported dependencies
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: false
          python-version: "3.12"

      - name: Install FFmpeg # Required by torchcodec
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install the project
        run: uv sync --resolution lowest-direct --all-extras --group test

      - name: Run tests
        run: uv run --no-sync pytest tests/

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, test-lowest]
    permissions:
      actions: write # Upload artifact
      artifact-metadata: write # Create the artifact storage record
      attestations: write # Write the build provenance to the repository attestation store
      id-token: write # Sigstore signing of the provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: false

      - name: Build wheel and sdist
        run: uv build

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload dists
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: publish-to-pypi
    permissions:
      actions: read # Download artifact
      id-token: write # Needed for trusted publishing, and to sign the attestations
    steps:
      - name: Download all dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: false

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Upload to PyPI
        run: uv publish --trusted-publishing always


  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish-to-pypi # Only tag a release once it is actually on PyPI.
    permissions:
      actions: read # Download artifact
      contents: write # Create GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: ./dist/

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag ./dist/*
